# Screenshot leak tests in real browsers (Chromium and Firefox), with the page's real OCR: invented screenshots are
# rendered, masked by index.html, downloaded, and checked (see tests/e2e/README.md).
# A smoke run on changes to the page, the OCR or the tests; every variant every night and on demand.
name: e2e
on:
  push:
    paths: ['index.html', 'ocr/**', 'tests/e2e/**', 'tests/lib/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['index.html', 'ocr/**', 'tests/e2e/**', 'tests/lib/**', '.github/workflows/e2e.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Smoke run (one variant per screenshot)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: node run.mjs --browsers=chromium,firefox
      - name: Full run (every variant)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node run.mjs --full --browsers=chromium,firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-leak-report
          path: tests/e2e/out/
          retention-days: 14
