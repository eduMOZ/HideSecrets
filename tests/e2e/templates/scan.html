<!doctype html>

<style>

  h1 { font-size: 1.5em; text-align: center; margin: 0 0 14px; letter-spacing: .05em; }
  .row { border-bottom: 1px dotted var(--line); padding: 5px 0; } .l { display: inline-block; width: 260px; }
